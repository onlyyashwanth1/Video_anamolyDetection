# shared_best: one action configuration for UCF-Crime and XD-Violence (prompts only, no memory).
# Selected on source-group validation. Its prompts enumerate the benchmark categories,
# so its scores are benchmark-tailored development estimates, not a general model.
# Pooling: mean_max_half of covering windows, then 12 s centered smoothing (offline).
extends:
- ../base.yaml
architecture: action
temporal:
  score_pooling: mean_max_half
  smoothing_seconds: 12.0
action:
  memory_weight: 0.0
  threshold: 0.5935198772337466
  temperature: 0.02
  image_temperature: 0.02
  text_temperature: 0.025
  image_weight: 0.8125
  action_transform: before_fusion
  image_prompt_reducer: logmeanexp
  text_prompt_reducer: max
  prompt_reduction_temperature: 0.05
  image_normal_prompts:
  - a video of people walking or standing peacefully
  - a video of people talking or sitting together peacefully
  - a video of people exercising or playing sports safely
  - a video of customers shopping and paying for goods
  - a video of workers carrying objects or doing ordinary work
  - a video of vehicles driving safely along a road
  - a video of vehicles parked beside a road or building
  - a video of pedestrians crossing a road safely
  - a video of a peaceful indoor or outdoor scene
  - a video of a quiet scene with no dangerous activity
  - a video of people entering or leaving a building normally
  - a video of people opening doors or handling their own belongings
  image_anomalous_prompts:
  - a video of a person abusing or physically hurting another person
  - a video of a person being arrested by police officers
  - a video of a person setting a building or vehicle on fire
  - a video of people violently assaulting another person
  - a video of a person breaking into a building
  - a video of a large explosion with flames and smoke
  - a video of people fighting with punches and kicks
  - a video of a road accident with vehicles colliding
  - a video of a person robbing another person with threats or violence
  - a video of a person shooting a gun
  - a video of a person stealing merchandise from a shop
  - a video of a person stealing belongings or a vehicle
  - a video of a person intentionally damaging property
  - a video of people rioting and violently damaging their surroundings
  - a video of people being shot by gunfire
  - a video of a vehicle colliding with another vehicle or a pedestrian
  text_normal_prompts:
  - people talking peacefully
  - people walking normally
  - people playing sports normally
  - vehicles moving normally on a road
  - people carrying objects
  - a quiet scene without dangerous activity
  - people standing and waiting in a public place
  - people running or exercising during a sports activity
  - people greeting or hugging one another
  - people sitting or resting peacefully
  - a person browsing items on shelves in a shop
  - a customer paying for items at a checkout counter
  - a worker loading or unloading boxes
  - a person opening a door with a key
  - a person placing their belongings into a bag
  - a person picking up and carrying an object normally
  - cars parked along a street or in a parking lot
  - cars stopping and waiting at a traffic intersection
  - a vehicle passing another vehicle safely
  - a driver getting into or out of a parked car
  - pedestrians crossing a road safely
  - a police officer talking calmly with a person
  - people entering or leaving a building normally
  - a person cleaning or repairing a building
  - a person cooking food over a controlled flame
  - a person climbing or playing on sports equipment
  text_anomalous_prompts:
  - a person punching or kicking another person
  - a person firing a gun
  - vehicles colliding in a road accident
  - a fire or explosion
  - a person smashing property
  - a person forcibly taking another person's belongings
  - a person beating another person who is lying on the ground
  - a group of people physically attacking another person
  - a person violently pushing another person to the ground
  - a person dragging or forcibly restraining another person
  - police officers chasing and tackling a person
  - a person pointing a handgun at another person
  - a person threatening another person with a knife
  - a vehicle striking a pedestrian
  - a vehicle crashing into a roadside obstacle
  - a vehicle overturning on a road
  - a person breaking a window to enter a building
  - a person forcing open a closed door with a tool
  - a person climbing over a gate or fence to enter a property
  - a person breaking the window of a parked car
  - a person grabbing a bag from another person's hands
  - a person removing an object from another person's bag
  - a person hiding merchandise inside their clothing in a shop
  - a person deliberately igniting material beside a building
  - a building or vehicle engulfed in flames and smoke
  - a person spraying graffiti on a wall
