# UCF-Crime: 800 normal training videos -> normal memory; 290 annotated test videos.
# Ollama ports differ per dataset so runs can share a machine.
evaluation:
  dataset: UCF-Crime
  normal_dir: data/UCFCrime/Normal_Videos_event
  test_dir: data/UCFCrime/Testing_Video
  annotation_file: data/UCFCrime/Temporal_Anomaly_Annotation_Five_FPS.txt
  memory_bank_path: outputs/memory/ucf_unmasked_v1.npz
  checkpoint_dir: outputs/checkpoints/ucf_unmasked
reasoning:
  base_port: 11500
